<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cart – Amenity Food</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand"><span>🍽️</span> Amenity Food</div>
  <ul class="nav-links">
    <li><a href="/dashboard"><i class="fa fa-home"></i> Home</a></li>
    <li><a href="/menu"><i class="fa fa-utensils"></i> Menu</a></li>
    <li><a href="/cart" class="active"><i class="fa fa-shopping-cart"></i> Cart <span class="cart-badge" id="cartBadge">0</span></a></li>
    <li><a href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a></li>
  </ul>
  <div class="nav-user"><i class="fa fa-user-circle"></i> {{ username }}</div>
</nav>

<div class="page-header">
  <h1><i class="fa fa-shopping-cart"></i> Your Cart</h1>
  <p>Review your order before placing it</p>
</div>

<div class="cart-layout">
  <!-- Cart Items -->
  <div class="cart-items-panel">
    <div id="cartEmpty" class="empty-state" style="display:none">
      <i class="fa fa-shopping-cart fa-3x"></i>
      <p>Your cart is empty!</p>
      <a href="/menu" class="btn-hero" style="display:inline-block;margin-top:1rem">Browse Menu</a>
    </div>
    <table class="cart-table" id="cartTable">
      <thead>
        <tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
      </thead>
      <tbody id="cartBody"></tbody>
    </table>
  </div>

  <!-- Summary -->
  <div class="cart-summary">
    <h2>Order Summary</h2>
    <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
    <div class="summary-row"><span>Tax (5%)</span><span id="tax">₹0</span></div>
    <div class="summary-row total"><span>Grand Total</span><span id="grandTotal">₹0</span></div>

    <div class="input-group" style="margin:1rem 0">
      <i class="fa fa-user"></i>
      <input type="text" id="customerName" placeholder="Your Name" value="{{ username }}"/>
    </div>

    <button onclick="placeOrder()" style="
      display:block;
      width:100%;
      padding:.9rem 1rem;
      margin-top:1rem;
      background:linear-gradient(135deg,#ff6b35,#f7931e);
      color:#fff;
      border:none;
      border-radius:12px;
      font-family:'Poppins',sans-serif;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 4px 15px rgba(255,107,53,.4);
      letter-spacing:.3px;
      transition:transform .2s,box-shadow .2s;
    " onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 25px rgba(255,107,53,.5)'"
       onmouseout="this.style.transform='';this.style.boxShadow='0 4px 15px rgba(255,107,53,.4)'">
      <i class="fa fa-check-circle"></i> Place Order
    </button>
    <a href="/menu" class="btn-secondary full-width" style="display:block;margin-top:.5rem;text-align:center">
      <i class="fa fa-arrow-left"></i> Continue Shopping
    </a>
    <button class="btn-danger full-width" onclick="clearCart()" style="margin-top:.5rem">
      <i class="fa fa-trash"></i> Clear Cart
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="{{ url_for('static',filename='js/cart.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', renderCart);
function renderCart() {
  const cart = getCart();
  const tbody = document.getElementById('cartBody');
  const empty = document.getElementById('cartEmpty');
  const table = document.getElementById('cartTable');
  tbody.innerHTML = '';
  if (!cart.length) { empty.style.display='flex'; table.style.display='none'; return; }
  empty.style.display='none'; table.style.display='table';
  let sub = 0;
  cart.forEach((item, idx) => {
    const st = item.price * item.qty;
    sub += st;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>₹${item.price}</td>
      <td>
        <div class="qty-control small">
          <button onclick="updateCartQty(${idx},-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="updateCartQty(${idx},1)">+</button>
        </div>
      </td>
      <td>₹${st}</td>
      <td><button class="btn-danger-sm" onclick="removeFromCart(${idx})"><i class="fa fa-times"></i></button></td>`;
    tbody.appendChild(tr);
  });
  const tax = +(sub * 0.05).toFixed(2);
  document.getElementById('subtotal').textContent   = '₹' + sub.toFixed(2);
  document.getElementById('tax').textContent        = '₹' + tax.toFixed(2);
  document.getElementById('grandTotal').textContent = '₹' + (sub + tax).toFixed(2);
  updateBadge();
}

function updateCartQty(idx, delta) {
  const cart = getCart();
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  saveCart(cart);
  renderCart();
}
function removeFromCart(idx) {
  const cart = getCart();
  cart.splice(idx, 1);
  saveCart(cart);
  renderCart();
}
function clearCart() {
  saveCart([]);
  renderCart();
}

async function placeOrder() {
  const cart = getCart();
  if (!cart.length) { showToast('Cart is empty!', 'error'); return; }
  const name = document.getElementById('customerName').value.trim() || '{{ username }}';
  const items = cart.map(i => ({ id: i.id, qty: i.qty }));
  const res  = await fetch('/place_order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ customer_name: name, items })
  });
  const data = await res.json();
  if (data.success) {
    saveCart([]);
    updateBadge();
    window.location.href = '/bill_multi?ids=' + data.order_ids.join(',');
  } else {
    showToast(data.message || 'Order failed!', 'error');
  }
}
</script>
</body>
</html>
